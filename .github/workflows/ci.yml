name: JARVIS CI - Production

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for secrets in repo
        run: |
          echo "Checking for secrets..."
          ! grep -r "BEGIN RSA PRIVATE" --include="*.py" --include="*.json" --include="*.env" . || (echo "Private key found!" && exit 1)
          ! grep -r "sk-" --include="*.py" . | grep -i api || echo "Potential API key - manual review"
          echo "No obvious secrets found"
      
      - name: Check .gitignore
        run: |
          test -f .gitignore
          grep -q ".env" .gitignore
          grep -q "*.key" .gitignore
          echo ".gitignore OK"

  test:
    runs-on: ubuntu-latest
    needs: security-check
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      
      - name: Run tests
        run: |
          pytest tests/ -v

  hardening-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile security
        run: |
          grep -q "USER jarvis" Dockerfile
          grep -q "no-new-privileges" Dockerfile || grep -q "no-new-privileges" docker-compose.yml
          echo "Docker hardening OK"
